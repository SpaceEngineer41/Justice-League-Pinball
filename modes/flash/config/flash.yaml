#config_version=6

mode:
  start_events:
    - start_flash_mode
    - resume_flash_mode

  stop_events:
    - stop_mode_flash
    - start_character_select_mode
    - justice_league_multiball_beginning

  priority: 600


variable_player:
  # Character-specific scoring can be added here.\n

slide_player:
  # Fresh selection only: play the character intro.
  mode_flash_started{current_player.character_mode_resuming == 0}:
    flash_character_select:
      priority: 900
      expire: 5s

  # Resume skips the intro. Add a persistent Flash gameplay slide
  # here later if this character receives one.
  #
  # mode_flash_started{current_player.character_mode_resuming == 1}:
  #   flash_mode_background:
  #     priority: 100


sound_player:
  # Fresh selection: start music after the intro is removed.
  slide_flash_character_select_removed:
    flash_theme:
      action: play
      loops: -1
      bus: music
      volume: 0.5
      start_at: 9s

  # Resume: start music immediately without replaying the intro.
  mode_flash_started{current_player.character_mode_resuming == 1}:
    flash_theme:
      action: play
      loops: -1
      bus: music
      volume: 0.5
      start_at: 9s

  mode_flash_stopping:
    flash_theme:
      action: stop
      bus: music
