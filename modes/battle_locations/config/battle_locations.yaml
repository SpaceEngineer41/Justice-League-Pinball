#config_version=6

mode:
  start_events: ball_starting
  priority: 700
  stop_events: battle_all_locations_completed

# -----------------------------------------------------------------------------
# PLAYER VARIABLES
# -----------------------------------------------------------------------------
variable_player:
  mode_battle_locations_started:
    battle_location_index:
      action: set
      int: 0
    battle_sequences_made:
      action: set
      int: 0
    battle_bank_ready:
      action: set
      int: 0

    # Themyscira tracking
    themyscira_drops_made:
      action: set
      int: 0

    # Atlantis tracking
    atlantis_bank_total_hits:
      action: set
      int: 0
    atlantis_steppenwolf_hits:
      action: set
      int: 0

    # Gotham tracking
    gotham_bank_total_hits:
      action: set
      int: 0
    gotham_steppenwolf_hits:
      action: set
      int: 0

    # Metropolis tracking
    metropolis_bank_total_hits:
      action: set
      int: 0
    metropolis_steppenwolf_hits:
      action: set
      int: 0

    # Pozharnov tracking
    pozharnov_bank_total_hits:
      action: set
      int: 0
    pozharnov_steppenwolf_hits:
      action: set
      int: 0

  battle_advance_location:
    battle_location_index:
      action: add
      int: 1
    battle_sequences_made:
      action: set
      int: 0
    battle_bank_ready:
      action: set
      int: 0

    themyscira_drops_made:
      action: set
      int: 0

    atlantis_bank_total_hits:
      action: set
      int: 0
    atlantis_steppenwolf_hits:
      action: set
      int: 0

    gotham_bank_total_hits:
      action: set
      int: 0
    gotham_steppenwolf_hits:
      action: set
      int: 0

    metropolis_bank_total_hits:
      action: set
      int: 0
    metropolis_steppenwolf_hits:
      action: set
      int: 0

    pozharnov_bank_total_hits:
      action: set
      int: 0
    pozharnov_steppenwolf_hits:
      action: set
      int: 0

  battle_set_bank_ready:
    battle_bank_ready:
      action: set
      int: 1

  battle_clear_bank_ready:
    battle_bank_ready:
      action: set
      int: 0

  battle_inc_sequences:
    battle_sequences_made:
      action: add
      int: 1

  # --- Themyscira ---
  battle_themyscira_inc_drops:
    themyscira_drops_made:
      action: add
      int: 1

  # --- Atlantis ---
  battle_atlantis_inc_bank_hit:
    atlantis_bank_total_hits:
      action: add
      int: 1

  battle_atlantis_inc_steppenwolf:
    atlantis_steppenwolf_hits:
      action: add
      int: 1

  # --- Gotham ---
  battle_gotham_inc_bank_hit:
    gotham_bank_total_hits:
      action: add
      int: 1

  battle_gotham_inc_steppenwolf:
    gotham_steppenwolf_hits:
      action: add
      int: 1

  # --- Metropolis ---
  battle_metropolis_inc_bank_hit:
    metropolis_bank_total_hits:
      action: add
      int: 1

  battle_metropolis_inc_steppenwolf:
    metropolis_steppenwolf_hits:
      action: add
      int: 1

  # --- Pozharnov ---
  battle_pozharnov_inc_bank_hit:
    pozharnov_bank_total_hits:
      action: add
      int: 1

  battle_pozharnov_inc_steppenwolf:
    pozharnov_steppenwolf_hits:
      action: add
      int: 1

  # Optional scoring for drops
  drop_target_drop_main_left_down:
    score: 10000
  drop_target_drop_main_middle_down:
    score: 10000
  drop_target_drop_main_right_down:
    score: 10000

  # Optional scoring for Steppenwolf sequence completion
  battle_steppenwolf_made:
    score: 250000


# -----------------------------------------------------------------------------
# EVENTS
# -----------------------------------------------------------------------------
event_player:

  # ---------------------------------------------------------------------------
  # MODE START
  # ---------------------------------------------------------------------------
  mode_battle_locations_started:
    battle_start_current_location:
      delay: 1ms


  # ===========================================================================
  # THEMYSCIRA - INDEX 0
  # 3 individual drops -> Steppenwolf -> complete
  # ===========================================================================

  drop_target_drop_main_left_down{current_player.battle_location_index==0}:
    - battle_themyscira_inc_drops
    - battle_themyscira_play_drop_video

  drop_target_drop_main_middle_down{current_player.battle_location_index==0}:
    - battle_themyscira_inc_drops
    - battle_themyscira_play_drop_video

  drop_target_drop_main_right_down{current_player.battle_location_index==0}:
    - battle_themyscira_inc_drops
    - battle_themyscira_play_drop_video

  battle_themyscira_play_drop_video{current_player.themyscira_drops_made==1}:
    - clear_battle_location_videos
    - battle_themyscira_x1

  battle_themyscira_play_drop_video{current_player.themyscira_drops_made==2}:
    - clear_battle_location_videos
    - battle_themyscira_x2

  battle_themyscira_play_drop_video{current_player.themyscira_drops_made==3}:
    - clear_battle_location_videos
    - battle_themyscira_x3


  # ===========================================================================
  # ATLANTIS - INDEX 1
  # 2 sequences
  # 3 bank hits -> Steppenwolf
  # 3 more bank hits -> Steppenwolf -> complete
  # ===========================================================================

  shot_main_drop_left_hit{current_player.battle_location_index==1}:
    - battle_atlantis_inc_bank_hit
    - battle_atlantis_play_bank_video

  shot_main_drop_middle_hit{current_player.battle_location_index==1}:
    - battle_atlantis_inc_bank_hit
    - battle_atlantis_play_bank_video

  shot_main_drop_right_hit{current_player.battle_location_index==1}:
    - battle_atlantis_inc_bank_hit
    - battle_atlantis_play_bank_video

  battle_atlantis_play_bank_video{current_player.atlantis_bank_total_hits==1}:
    - clear_battle_location_videos
    - battle_atlantis_x1

  battle_atlantis_play_bank_video{current_player.atlantis_bank_total_hits==2}:
    - clear_battle_location_videos
    - battle_atlantis_x2

  battle_atlantis_play_bank_video{current_player.atlantis_bank_total_hits==3}:
    - clear_battle_location_videos
    - battle_atlantis_x3

  battle_atlantis_play_bank_video{current_player.atlantis_bank_total_hits==4}:
    - clear_battle_location_videos
    - battle_atlantis_x4

  battle_atlantis_play_bank_video{current_player.atlantis_bank_total_hits==5}:
    - clear_battle_location_videos
    - battle_atlantis_x5

  battle_atlantis_play_bank_video{current_player.atlantis_bank_total_hits==6}:
    - clear_battle_location_videos
    - battle_atlantis_x6


  # ===========================================================================
  # GOTHAM - INDEX 2
  # 3 sequences
  # 9 total main-drop hits
  # ===========================================================================

  shot_main_drop_left_hit{current_player.battle_location_index==2}:
    - battle_gotham_inc_bank_hit
    - battle_gotham_play_bank_video

  shot_main_drop_middle_hit{current_player.battle_location_index==2}:
    - battle_gotham_inc_bank_hit
    - battle_gotham_play_bank_video

  shot_main_drop_right_hit{current_player.battle_location_index==2}:
    - battle_gotham_inc_bank_hit
    - battle_gotham_play_bank_video

  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==1}:
    - clear_battle_location_videos
    - battle_gotham_x1
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==2}:
    - clear_battle_location_videos
    - battle_gotham_x2
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==3}:
    - clear_battle_location_videos
    - battle_gotham_x3
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==4}:
    - clear_battle_location_videos
    - battle_gotham_x4
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==5}:
    - clear_battle_location_videos
    - battle_gotham_x5
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==6}:
    - clear_battle_location_videos
    - battle_gotham_x6
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==7}:
    - clear_battle_location_videos
    - battle_gotham_x7
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==8}:
    - clear_battle_location_videos
    - battle_gotham_x8
  battle_gotham_play_bank_video{current_player.gotham_bank_total_hits==9}:
    - clear_battle_location_videos
    - battle_gotham_x9


  # ===========================================================================
  # METROPOLIS - INDEX 3
  # 4 sequences
  # 12 total main-drop hits
  # ===========================================================================

  shot_main_drop_left_hit{current_player.battle_location_index==3}:
    - battle_metropolis_inc_bank_hit
    - battle_metropolis_play_bank_video

  shot_main_drop_middle_hit{current_player.battle_location_index==3}:
    - battle_metropolis_inc_bank_hit
    - battle_metropolis_play_bank_video

  shot_main_drop_right_hit{current_player.battle_location_index==3}:
    - battle_metropolis_inc_bank_hit
    - battle_metropolis_play_bank_video

  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==1}:
    - clear_battle_location_videos
    - battle_metropolis_x1
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==2}:
    - clear_battle_location_videos
    - battle_metropolis_x2
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==3}:
    - clear_battle_location_videos
    - battle_metropolis_x3
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==4}:
    - clear_battle_location_videos
    - battle_metropolis_x4
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==5}:
    - clear_battle_location_videos
    - battle_metropolis_x5
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==6}:
    - clear_battle_location_videos
    - battle_metropolis_x6
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==7}:
    - clear_battle_location_videos
    - battle_metropolis_x7
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==8}:
    - clear_battle_location_videos
    - battle_metropolis_x8
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==9}:
    - clear_battle_location_videos
    - battle_metropolis_x9
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==10}:
    - clear_battle_location_videos
    - battle_metropolis_x10
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==11}:
    - clear_battle_location_videos
    - battle_metropolis_x11
  battle_metropolis_play_bank_video{current_player.metropolis_bank_total_hits==12}:
    - clear_battle_location_videos
    - battle_metropolis_x12


  # ===========================================================================
  # POZHARNOV - INDEX 4
  # 5 sequences
  # 15 total main-drop hits
  # ===========================================================================

  shot_main_drop_left_hit{current_player.battle_location_index==4}:
    - battle_pozharnov_inc_bank_hit
    - battle_pozharnov_play_bank_video

  shot_main_drop_middle_hit{current_player.battle_location_index==4}:
