# -----------------------------------------------------------------------------
timers:

  steppenwolf_to_scoop_guard:
    start_value: 1
    end_value: 0
    direction: down
    tick_interval: 1s

    control_events:
      - event: shot_steppenwolf_hit
        action: start

      - event: balldevice_bd_mystery_scoop_ball_enter
        action: stop