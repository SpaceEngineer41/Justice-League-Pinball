    - battle_pozharnov_play_bank_video

  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==1}:
    - clear_battle_location_videos
    - battle_pozharnov_x1
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==2}:
    - clear_battle_location_videos
    - battle_pozharnov_x2
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==3}:
    - clear_battle_location_videos
    - battle_pozharnov_x3
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==4}:
    - clear_battle_location_videos
    - battle_pozharnov_x4
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==5}:
    - clear_battle_location_videos
    - battle_pozharnov_x5
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==6}:
    - clear_battle_location_videos
    - battle_pozharnov_x6
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==7}:
    - clear_battle_location_videos
    - battle_pozharnov_x7
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==8}:
    - clear_battle_location_videos
    - battle_pozharnov_x8
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==9}:
    - clear_battle_location_videos
    - battle_pozharnov_x9
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==10}:
    - clear_battle_location_videos
    - battle_pozharnov_x10
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==11}:
    - clear_battle_location_videos
    - battle_pozharnov_x11
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==12}:
    - clear_battle_location_videos
    - battle_pozharnov_x12
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==13}:
    - clear_battle_location_videos
    - battle_pozharnov_x13
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==14}:
    - clear_battle_location_videos
    - battle_pozharnov_x14
  battle_pozharnov_play_bank_video{current_player.pozharnov_bank_total_hits==15}:
    - clear_battle_location_videos
    - battle_pozharnov_x15


  # ---------------------------------------------------------------------------
  # CENTER BANK READY LOGIC
  # ---------------------------------------------------------------------------

  drop_target_bank_center_bank_down{device.drop_target_banks.center_bank.complete}:
    battle_set_bank_ready: {}

  drop_target_bank_center_bank_mixed:
    battle_clear_bank_ready: {}


  # ===========================================================================
  # STEPPENWOLF PROGRESSION
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # THEMYSCIRA
  # ---------------------------------------------------------------------------
  shot_steppenwolf_hit{current_player.battle_location_index==0 and current_player.battle_bank_ready==1 and current_player.themyscira_drops_made>=3}:
    battle_steppenwolf_made: {}


  # ---------------------------------------------------------------------------
  # ATLANTIS
  # ---------------------------------------------------------------------------

  # Sequence 1
  shot_steppenwolf_hit{current_player.battle_location_index==1 and current_player.battle_bank_ready==1 and current_player.atlantis_bank_total_hits>=3 and current_player.atlantis_steppenwolf_hits==0}:
    - battle_atlantis_steppenwolf_x1
    - battle_atlantis_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 2 - Complete
  shot_steppenwolf_hit{current_player.battle_location_index==1 and current_player.battle_bank_ready==1 and current_player.atlantis_bank_total_hits>=6 and current_player.atlantis_steppenwolf_hits==1}:
    - battle_atlantis_complete
    - battle_atlantis_inc_steppenwolf
    - battle_steppenwolf_made


  # ---------------------------------------------------------------------------
  # GOTHAM
  # ---------------------------------------------------------------------------

  # Sequence 1
  shot_steppenwolf_hit{current_player.battle_location_index==2 and current_player.battle_bank_ready==1 and current_player.gotham_bank_total_hits>=3 and current_player.gotham_steppenwolf_hits==0}:
    - battle_gotham_steppenwolf_x1
    - battle_gotham_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 2
  shot_steppenwolf_hit{current_player.battle_location_index==2 and current_player.battle_bank_ready==1 and current_player.gotham_bank_total_hits>=6 and current_player.gotham_steppenwolf_hits==1}:
    - battle_gotham_steppenwolf_x2
    - battle_gotham_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 3 - Complete
  shot_steppenwolf_hit{current_player.battle_location_index==2 and current_player.battle_bank_ready==1 and current_player.gotham_bank_total_hits>=9 and current_player.gotham_steppenwolf_hits==2}:
    - battle_gotham_complete
    - battle_gotham_inc_steppenwolf
    - battle_steppenwolf_made


  # ---------------------------------------------------------------------------
  # METROPOLIS
  # ---------------------------------------------------------------------------

  # Sequence 1
  shot_steppenwolf_hit{current_player.battle_location_index==3 and current_player.battle_bank_ready==1 and current_player.metropolis_bank_total_hits>=3 and current_player.metropolis_steppenwolf_hits==0}:
    - battle_metropolis_steppenwolf_x1
    - battle_metropolis_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 2
  shot_steppenwolf_hit{current_player.battle_location_index==3 and current_player.battle_bank_ready==1 and current_player.metropolis_bank_total_hits>=6 and current_player.metropolis_steppenwolf_hits==1}:
    - battle_metropolis_steppenwolf_x2
    - battle_metropolis_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 3
  shot_steppenwolf_hit{current_player.battle_location_index==3 and current_player.battle_bank_ready==1 and current_player.metropolis_bank_total_hits>=9 and current_player.metropolis_steppenwolf_hits==2}:
    - battle_metropolis_steppenwolf_x3
    - battle_metropolis_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 4 - Complete
  shot_steppenwolf_hit{current_player.battle_location_index==3 and current_player.battle_bank_ready==1 and current_player.metropolis_bank_total_hits>=12 and current_player.metropolis_steppenwolf_hits==3}:
    - battle_metropolis_complete
    - battle_metropolis_inc_steppenwolf
    - battle_steppenwolf_made


  # ---------------------------------------------------------------------------
  # POZHARNOV
  # ---------------------------------------------------------------------------

  # Sequence 1
  shot_steppenwolf_hit{current_player.battle_location_index==4 and current_player.battle_bank_ready==1 and current_player.pozharnov_bank_total_hits>=3 and current_player.pozharnov_steppenwolf_hits==0}:
    - battle_pozharnov_steppenwolf_x1
    - battle_pozharnov_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 2
  shot_steppenwolf_hit{current_player.battle_location_index==4 and current_player.battle_bank_ready==1 and current_player.pozharnov_bank_total_hits>=6 and current_player.pozharnov_steppenwolf_hits==1}:
    - battle_pozharnov_steppenwolf_x2
    - battle_pozharnov_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 3
  shot_steppenwolf_hit{current_player.battle_location_index==4 and current_player.battle_bank_ready==1 and current_player.pozharnov_bank_total_hits>=9 and current_player.pozharnov_steppenwolf_hits==2}:
    - battle_pozharnov_steppenwolf_x3
    - battle_pozharnov_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 4
  shot_steppenwolf_hit{current_player.battle_location_index==4 and current_player.battle_bank_ready==1 and current_player.pozharnov_bank_total_hits>=12 and current_player.pozharnov_steppenwolf_hits==3}:
    - battle_pozharnov_steppenwolf_x4
    - battle_pozharnov_inc_steppenwolf
    - battle_clear_bank_ready
    - drop_target_bank_center_bank_reset
    - battle_steppenwolf_made

  # Sequence 5 - Complete
  shot_steppenwolf_hit{current_player.battle_location_index==4 and current_player.battle_bank_ready==1 and current_player.pozharnov_bank_total_hits>=15 and current_player.pozharnov_steppenwolf_hits==4}:
    - battle_pozharnov_complete
    - battle_pozharnov_inc_steppenwolf
    - battle_steppenwolf_made


  # ===========================================================================
  # DARKSEID - CURRENTLY DISABLED
  # ===========================================================================
  #
  # Leaving this here for future use if Darkseid becomes a battle location.
  #
  # shot_steppenwolf_hit{current_player.battle_location_index==5 and current_player.battle_bank_ready==1}:
  #   battle_steppenwolf_made: {}


  # ---------------------------------------------------------------------------
  # ANY SUCCESSFUL STEPPENWOLF HIT
  # ---------------------------------------------------------------------------
  battle_steppenwolf_made:
    - battle_clear_bank_ready
    - battle_inc_sequences
    - battle_check_location_complete
    - battle_themyscira_complete{current_player.battle_location_index==0 and current_player.themyscira_drops_made>=3}


  # ---------------------------------------------------------------------------
  # SUBWAY CONFIRM / SAFE RESET + KICKOUT
  # ---------------------------------------------------------------------------
  balldevice_bd_mystery_scoop_ball_enter:
    drop_target_bank_center_bank_reset:
      delay: 300ms
    eject_bd_mystery_scoop:
      delay: 600ms


  # ===========================================================================
  # START CURRENT LOCATION
  # ===========================================================================

  battle_start_current_location{current_player.battle_location_index==0}:
    battle_start_themyscira

  battle_start_current_location{current_player.battle_location_index==1}:
    battle_start_atlantis

  battle_start_current_location{current_player.battle_location_index==2}:
    battle_start_gotham

  battle_start_current_location{current_player.battle_location_index==3}:
    battle_start_metropolis

  battle_start_current_location{current_player.battle_location_index==4}:
    battle_start_pozharnov

  # Darkseid currently disabled
  # battle_start_current_location{current_player.battle_location_index==5}:
  #   battle_start_darkseid


  # ===========================================================================
  # COMPLETION THRESHOLDS
  # ===========================================================================

  battle_check_location_complete{current_player.battle_location_index==0 and current_player.battle_sequences_made>=1}:
    battle_location_completed

  battle_check_location_complete{current_player.battle_location_index==1 and current_player.battle_sequences_made>=2}:
    battle_location_completed

  battle_check_location_complete{current_player.battle_location_index==2 and current_player.battle_sequences_made>=3}:
    battle_location_completed

  battle_check_location_complete{current_player.battle_location_index==3 and current_player.battle_sequences_made>=4}:
    battle_location_completed

  battle_check_location_complete{current_player.battle_location_index==4 and current_player.battle_sequences_made>=5}:
    battle_location_completed

  # Darkseid currently disabled
  # battle_check_location_complete{current_player.battle_location_index==5 and current_player.battle_sequences_made>=6}:
  #   battle_location_completed


  # ---------------------------------------------------------------------------
  # LOCATION COMPLETE
  # ---------------------------------------------------------------------------
  battle_location_completed:
