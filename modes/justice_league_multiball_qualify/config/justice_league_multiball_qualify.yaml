    l_right_ramp_2: off
    l_right_ramp_3: off

    l_line: off
    l_mystery: off

    l_orbit_left_arrow: off
    l_orbit_left_1: off
    l_orbit_left_2: off
    l_orbit_left_3: off

    l_right_drop_right: off
    l_right_drop_middle: off
    l_right_drop_left: off

    l_left_drop_left: off
    l_left_drop_middle: off
    l_left_drop_right: off

    l_orbit_right_arrow: off
    l_orbit_right_1: off
    l_orbit_right_2: off
    l_orbit_right_3: off

    l_batman: off
    l_superman: off
    l_flash: off
    l_cyborg: off
    l_aquaman: off
    l_wonder_woman: off

    l_steppenwolf: off

