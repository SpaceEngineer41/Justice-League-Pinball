#config_version=6

# Base mode that starts at the beginning of each ball
# and stops at the end of each ball.

mode:
  start_events: ball_starting
  stop_events: ball_will_end
  priority: 100

event_player:
  # Uncomment this if you want character select at the start of the first ball.
  # ball_started{ball==1}: start_character_select_mode

  character_select_batman_selected:
    - set_active_character_batman
    - start_batman_mode

  character_select_wonder_woman_selected:
    - set_active_character_wonder_woman
    - start_wonder_woman_mode

  character_select_aquaman_selected:
    - set_active_character_aquaman
    - start_aquaman_mode

  character_select_cyborg_selected:
    - set_active_character_cyborg
    - start_cyborg_mode

  character_select_flash_selected:
    - set_active_character_flash
    - start_flash_mode

  character_select_superman_selected:
    - set_active_character_superman
    - start_superman_mode

variable_player:
  set_active_character_batman:
    active_character:
      action: set
      string: batman
    character_mode_resuming:
      action: set
      int: 0

  set_active_character_wonder_woman:
    active_character:
      action: set
      string: wonder_woman
    character_mode_resuming:
      action: set
      int: 0

  set_active_character_aquaman:
    active_character:
      action: set
      string: aquaman
    character_mode_resuming:
      action: set
      int: 0

  set_active_character_cyborg:
    active_character:
      action: set
      string: cyborg
    character_mode_resuming:
      action: set
      int: 0

  set_active_character_flash:
    active_character:
      action: set
      string: flash
    character_mode_resuming:
      action: set
      int: 0

  set_active_character_superman:
    active_character:
      action: set
      string: superman
    character_mode_resuming:
      action: set
      int: 0

slide_player:
  mode_base_started: base_slide

# Persistent roster HUD (hero icons, grey/color by <hero>_mode_status).
widget_player:
  mode_base_started:
    batman_roster_icon:
      slide: _overlay
      x: 40
      y: 20
  mode_base_stopping:
    batman_roster_icon:
      slide: _overlay
      action: remove

